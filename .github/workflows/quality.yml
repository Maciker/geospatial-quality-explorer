name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEOSPATIAL_POSTGIS_URL: postgres://explorer:explorer@127.0.0.1:5432/geospatial_quality_explorer
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geospatial_quality_explorer
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: explorer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U explorer -d geospatial_quality_explorer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Environment and build
        run: |
          pnpm doctor
          pnpm build
      - name: Deterministic quality gates
        run: pnpm quality:ci
      - name: Browser journey
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Adapter and scaffold validation
        run: pnpm quality:stabilization
      - name: Reject generated drift or tracked changes
        shell: bash
        run: |
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Untracked non-ignored files were generated; commit the canonical changes and their projections."
            git ls-files --others --exclude-standard
            exit 1
          fi

# No provider credentials, MCP execution or fabricated QA result in CI.
# Independent cross-model QA and maintainer approval remain merge requirements.
