services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geospatial_quality_explorer
      POSTGRES_USER: explorer
      POSTGRES_PASSWORD: explorer
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer -d geospatial_quality_explorer"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgis_data:
